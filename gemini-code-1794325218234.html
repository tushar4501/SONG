<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Gravity Music Experience</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05050D;
            overflow-x: hidden;
        }

        /* Background Video Overlay */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 13, 0.65);
            backdrop-filter: blur(4px);
            z-index: -1;
        }

        /* Custom Anti-Gravity Floating Animation */
        @keyframes floatSlow {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-16px) rotate(0.8deg);
            }
        }

        @keyframes floatSubtle {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.08);
            }
        }

        @keyframes spinVinyl {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .animate-float {
            animation: floatSlow 6s ease-in-out infinite;
        }

        .animate-float-subtle {
            animation: floatSubtle 4s ease-in-out infinite;
        }

        .animate-pulse-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .vinyl-spin {
            animation: spinVinyl 12s linear infinite;
        }

        .vinyl-paused {
            animation-play-state: paused;
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(18, 18, 38, 0.55);
